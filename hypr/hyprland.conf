monitor = , preferred, auto, 1

$terminal = kitty
$menu     = rofi -show drun -theme ~/.config/rofi/launcher.rasi
$wallpick = ~/.config/scripts/wallpaper.sh

exec-once = swww-daemon
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = sleep 1 && ~/.config/scripts/wallpaper.sh --restore

env = XCURSOR_SIZE,24

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(e8e4c9ff) rgba(e8845aff) 45deg
    col.inactive_border = rgba(2a2c33aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.88
    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.15
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.8, 0.25, 1
    animation = windows,    1, 5, ease, popin 85%
    animation = fade,       1, 5, ease
    animation = workspaces, 1, 5, ease, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad { natural_scroll = true }
}

$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, W, exec, $wallpick
bind = $mod, N, exec, ~/.config/scripts/wifi.sh
bind = $mod, Q, exec, ~/.config/scripts/wallpaper.sh --next
bind = $mod, C, killactive
bind = $mod, X, exec, ~/.config/scripts/power.sh
bind = $mod, L, exec, hyprlock
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, R, exec, hyprctl reload
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 3, easeOutQuint
    animation = inputFieldFade, 1, 5, easeOutQuint
    animation = inputFieldColors, 1, 5, easeOutQuint
    animation = inputFieldWidth, 1, 5, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Годинник
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(232, 228, 201, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(232, 228, 201, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Поле пароля
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    dots_fade_time = 250
    outer_color = rgba(232, 228, 201, 1.0)
    inner_color = rgba(20, 22, 26, 0.8)
    font_color = rgba(232, 228, 201, 1.0)
    check_color = rgba(232, 200, 122, 1.0)
    fail_color = rgba(232, 132, 90, 1.0)
    fade_on_empty = true
    fade_timeout = 1500
    rounding = 10
    placeholder_text = <i>пароль</i>
    fail_text = <i>невірно ($ATTEMPTS)</i>
    position = 0, -30
    halign = center
    valign = center
}
